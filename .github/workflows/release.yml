name: Release

# Push a tag such as v2.0 and this builds the Windows download and attaches it to a GitHub
# release. It can also be run by hand from the Actions tab to try the build without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the scan reader and the installer builder
        run: choco install tesseract innosetup --no-progress -y
      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest tests -q
      - name: Read the version
        id: version
        shell: bash
        run: echo "number=$(python -c 'import scrub_pdfs; print(scrub_pdfs.VERSION)')" >> "$GITHUB_OUTPUT"
      - name: Build the app
        run: python -m PyInstaller packaging/pdf_scrubber.spec --noconfirm
      - name: Check the built app starts and can read a scan
        env:
          PDF_SCRUBBER_HOME: ${{ runner.temp }}\scrubber-selftest
        run: |
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue   # use the real Windows display
          $app = Start-Process -FilePath "dist\PDF Scrubber\PDF Scrubber.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:PDF_SCRUBBER_HOME\selftest.log"
          if ($app.ExitCode -ne 0) { throw "The built app failed its self-test." }
      - name: Make the portable zip
        run: Compress-Archive -Path "dist\PDF Scrubber" -DestinationPath "dist\PDF-Scrubber-${{ steps.version.outputs.number }}-windows-portable.zip"
      - name: Make the installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.number }}" packaging\installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-downloads
          path: dist/PDF-Scrubber-*
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/PDF-Scrubber-* --title "PDF Scrubber ${{ steps.version.outputs.number }}" --generate-notes
