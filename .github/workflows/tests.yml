name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the scan reader (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install the scan reader (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress -y
      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Static check
        run: python -m pyflakes scrub_pdfs.py scrubber_gui.py tests
      - name: Tests
        run: python -m pytest tests -q
